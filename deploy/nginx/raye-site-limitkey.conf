# Rate-limit key for rayelinux.com: the IPv4 address, or the /64 of an IPv6
# address (one home or one server holds a whole /64; counting single
# addresses would hand a visitor 2^64 quotas). $remote_addr is printed in
# the RFC 5952 short form, so the /64 is rebuilt case by case:
# - the four first groups written out ("a:b:c:d:..."),
# - "::" inside them, the zeros it stands for filled back in,
# - "::" then five or six groups, where groups after "::" reach the prefix.
# Checked against Python's ipaddress by backend/tests/test_nginx_limitkey.py.
map $remote_addr $raye_limit_key {
    "~^::([0-9a-f]{1,4}):([0-9a-f]{1,4})(?::[0-9a-f]{1,4}){4}$"           "6:0:0:$1:$2";
    "~^::([0-9a-f]{1,4})(?::[0-9a-f]{1,4}){4}$"                            "6:0:0:0:$1";
    "~^([0-9a-f]{1,4})::([0-9a-f]{1,4})(?::[0-9a-f]{1,4}){4}$"            "6:$1:0:0:$2";
    "~^([0-9a-f]{1,4}):([0-9a-f]{1,4}):([0-9a-f]{1,4}):([0-9a-f]{1,4}):"  "6:$1:$2:$3:$4";
    "~^([0-9a-f]{1,4}):([0-9a-f]{1,4}):([0-9a-f]{1,4})::"                 "6:$1:$2:$3:0";
    "~^([0-9a-f]{1,4}):([0-9a-f]{1,4})::"                                  "6:$1:$2:0:0";
    "~^([0-9a-f]{1,4})::"                                                   "6:$1:0:0:0";
    "~^::"                                                                  "6:0:0:0:0";
    default                                                                 $binary_remote_addr;
}
