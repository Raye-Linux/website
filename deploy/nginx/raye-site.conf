# rayelinux.com. Traffic comes from the reverse proxy
# (@PROXY_IP@) only; the firewall drops everything else on port 80.

# no visitor address and no query string (it carries the email link tokens)
log_format raye_site '[$time_local] "$request_method $uri $server_protocol" '
                     '$status $body_bytes_sent $request_time';

include /etc/nginx/snippets/raye-site-limitkey.conf;
limit_req_zone $raye_limit_key zone=raye_api:10m rate=30r/m;
limit_req_zone $raye_limit_key zone=raye_support:10m rate=6r/m;
limit_conn_zone $raye_limit_key zone=raye_conn:10m;

map $sent_http_content_type $raye_cache {
    default                 "no-cache";
    ~^text/html             "no-cache";
    ~^text/css              "public, max-age=86400";
    ~javascript             "public, max-age=86400";
    ~^image/                "public, max-age=604800";
}

# www goes to the bare name
server {
    listen 80;
    server_name www.rayelinux.com;
    server_tokens off;
    access_log /var/log/nginx/raye-site.access.log raye_site;
    return 301 https://rayelinux.com$request_uri;
}

server {
    listen 80 default_server;
    server_name rayelinux.com _;
    server_tokens off;

    access_log /var/log/nginx/raye-site.access.log raye_site;
    # crit only: lines at error level and below (upstream down or slow,
    # rejected requests) carry the visitor address and the full request,
    # with the token of an email link. The backend has its own journal.
    error_log /var/log/nginx/raye-site.error.log crit;
    limit_req_log_level info;
    limit_conn_log_level info;

    # Location headers stay relative: the scheme here is http (TLS ends at
    # Cloudflare), so an absolute one would send visitors to http:// first
    absolute_redirect off;

    root /var/www/raye-site;
    index index.html;
    charset utf-8;

    # the real visitor address, as the reverse proxy appended it
    set_real_ip_from @PROXY_IP@;
    real_ip_header X-Forwarded-For;
    real_ip_recursive on;

    client_max_body_size 4k;
    client_body_timeout 10s;
    client_header_timeout 10s;
    keepalive_timeout 30s;
    limit_conn raye_conn 20;

    gzip on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_min_length 512;
    gzip_types text/css application/javascript image/svg+xml application/json text/plain;

    include /etc/nginx/snippets/raye-site-headers.conf;
    add_header Cache-Control $raye_cache always;

    error_page 404 /404.html;
    location = /404.html { internal; }

    # the help bubble: a whole conversation per request, and the answer is
    # streamed, so no buffering here nor on the reverse proxy (X-Accel-Buffering)
    location = /api/support/chat {
        limit_req zone=raye_support burst=10 nodelay;
        limit_req_status 429;
        client_max_body_size 16k;
        proxy_pass http://127.0.0.1:8081;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For "";
        proxy_connect_timeout 5s;
        proxy_read_timeout 150s;
        proxy_buffering off;
        proxy_cache off;
        proxy_intercept_errors off;
        add_header X-Accel-Buffering "no" always;
        add_header Strict-Transport-Security "max-age=15552000" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), interest-cohort=()" always;
        add_header Cross-Origin-Opener-Policy "same-origin" always;
    }

    # bug reports from the help box: text and an optional screenshot
    location = /api/support/bug {
        limit_req zone=raye_support burst=3 nodelay;
        limit_req_status 429;
        client_max_body_size 1m;
        proxy_pass http://127.0.0.1:8081;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For "";
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
        proxy_intercept_errors off;
        add_header Strict-Transport-Security "max-age=15552000" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), interest-cohort=()" always;
        add_header Cross-Origin-Opener-Policy "same-origin" always;
    }

    location /api/ {
        limit_req zone=raye_api burst=20 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:8081;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For "";
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
        proxy_intercept_errors off;
        # the backend sends its own no-store, CSP, nosniff and referrer
        # headers; add_header here stops the server-level ones being doubled
        add_header Strict-Transport-Security "max-age=15552000" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), interest-cohort=()" always;
        add_header Cross-Origin-Opener-Policy "same-origin" always;
    }

    # The French pages lived at the root until 2026-11-14; links to them
    # are out there (emails, Discord, search engines). Each one moves for
    # good to its /fr/ page. The bare / is the language picker (lang.js).
    location ~ ^/(telecharger|confidentialite|conditions|mentions-legales|licences|code-source|feuille-de-route)(?:/|/index\.html)?$ {
        return 301 /fr/$1/$is_args$args;
    }
    location ~ ^/download/?$ { return 301 /en/download/$is_args$args; }
    location ~ ^/roadmap/?$ { return 301 /en/roadmap/$is_args$args; }

    location / {
        try_files $uri $uri/ =404;
    }

    # no dotfiles, no backups
    location ~ /\. { return 404; }
    location ~ ~$ { return 404; }
}
